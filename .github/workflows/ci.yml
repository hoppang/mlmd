name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Verify vendored Windows ObjectBox library
        # lib/objectbox.dll is from the verified ObjectBox C v5.3.2
        # objectbox-windows-x64.zip release asset.
        run: |
          echo "614d00e1f6c7b23d676e784c39b67f56ed6a7889d172e7080ac52122d4695c6e  lib/objectbox.dll" \
            | sha256sum --check --strict

      - name: Verify Gradle wrapper
        # Generated artifacts from the official Gradle v9.1.0 distribution
        # and source tag (commit e45a8dbf2470c2e2474ccc25be9f49331406a07e).
        run: |
          echo "76805e32c009c0cf0dd5d206bddc9fb22ea42e84db904b764f3047de095493f3  android/gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum --check --strict
          echo "b2fe376b143a459ba5d0bd290dc89beed5399fc6d159cd1214bd642ea94bcf07  android/gradlew" \
            | sha256sum --check --strict
          echo "9386e790d58b9368ca8e034536a5baa688643d51cb37bfa462503d36fd0291a6  android/gradlew.bat" \
            | sha256sum --check --strict

      - name: Set up Flutter
        # v2.23.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'
          flutter-version: '3.44.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify generated sources are current
        run: |
          set -euo pipefail
          flutter gen-l10n
          dart run build_runner build
          generated_changes="$(git status --porcelain --untracked-files=all -- \
            lib/l10n \
            lib/objectbox.g.dart \
            lib/objectbox-model.json)"
          if [[ -n "${generated_changes}" ]]; then
            echo "Generated sources are not current:"
            echo "${generated_changes}"
            git diff -- lib/l10n lib/objectbox.g.dart lib/objectbox-model.json
            exit 1
          fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test scripts

      - name: Analyze project source
        run: flutter analyze

      - name: Install ObjectBox for tests
        env:
          OBJECTBOX_VERSION: '5.3.2'
          OBJECTBOX_SHA256: '6dbb5450c36dd11ee9074f16ecc61e79b45ff43c2082934601f3166b39c8a613'
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/objectbox-linux-x64.tar.gz"
          extract_dir="${RUNNER_TEMP}/objectbox-${OBJECTBOX_VERSION}"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "${archive}" \
            "https://github.com/objectbox/objectbox-c/releases/download/v${OBJECTBOX_VERSION}/objectbox-linux-x64.tar.gz"
          echo "${OBJECTBOX_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${extract_dir}"
          tar --extract --gzip --file "${archive}" --directory "${extract_dir}"
          sudo install -m 0755 "${extract_dir}/lib/libobjectbox.so" /usr/lib/libobjectbox.so
          sudo ldconfig

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce coverage baseline
        env:
          MINIMUM_LINE_COVERAGE: '65'
        run: |
          set -euo pipefail
          awk -F: -v minimum="${MINIMUM_LINE_COVERAGE}" '
            /^LF:/ { total += $2 }
            /^LH:/ { covered += $2 }
            END {
              if (total == 0) {
                print "No coverable lines found in coverage/lcov.info."
                exit 1
              }
              percentage = 100 * covered / total
              printf "### Test coverage\n\nLine coverage: %.2f%% (%d/%d); required: %.2f%%\n", percentage, covered, total, minimum
              if (percentage < minimum) exit 1
            }
          ' coverage/lcov.info | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Flutter
        # v2.23.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'
          flutter-version: '3.44.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Verify vendored Windows ObjectBox library
        shell: pwsh
        run: |
          $expected = '614d00e1f6c7b23d676e784c39b67f56ed6a7889d172e7080ac52122d4695c6e'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath 'lib/objectbox.dll').Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "lib/objectbox.dll SHA-256 mismatch: $actual"
          }

      - name: Set up Flutter
        # v2.23.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'
          flutter-version: '3.44.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run tests on Windows
        run: flutter test --no-pub

      - name: Build Windows debug bundle
        run: flutter build windows --debug --no-pub

  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Review dependency changes
        # v5.0.0
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
