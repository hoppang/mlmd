services:
  mlmd-sync-server:
    build:
      context: ../../server
    restart: unless-stopped
    environment:
      MLMD_LISTEN_ADDR: 0.0.0.0:8080
      MLMD_DATABASE_PATH: /data/mlmd.db
      MLMD_BOOTSTRAP_TOKEN: ${MLMD_BOOTSTRAP_TOKEN:?set MLMD_BOOTSTRAP_TOKEN}
    ports:
      - "${MLMD_LAN_ADDRESS:?set MLMD_LAN_ADDRESS}:8080:8080"
    volumes:
      - mlmd-sync-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/mlmd-server", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mlmd-sync-data:
